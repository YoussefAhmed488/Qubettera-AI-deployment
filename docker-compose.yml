services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${PGDATABASE:-ragdb}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change_me}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - qubettera-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    profiles: [web]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      # To run the backend against Supabase instead, set QUBETTERA_DB=supabase
      # and SUPABASE_DB_URL in .env. Those take precedence over the local
      # PGHOST/PGPORT below, which stay for the bundled postgres service.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - qubettera-models:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    profiles: [web]
    build: ./frontend
    environment:
      FASTAPI_INTERNAL_URL: http://backend:8000
      MOCK_BACKEND: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qubettera-postgres:
  qubettera-models:

